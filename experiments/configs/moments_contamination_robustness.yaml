defaults:
  - aggregators: all
  - _self_

run_name: moments_contamination_robustness
save_dir: results
override: true
save_data_visualizations: true
num_visualization_samples: 3

# This experiment studies recovery of the latent clean Gaussian mixture when
# the observations do not follow that model exactly. Forward KL and parameter
# errors therefore target the uncontaminated Gaussian core. For explicit
# contamination, ARI is computed only on the clean observations; Student-t
# observations all retain their component identity and are all used by ARI.
#
# The 50 independent datasets estimate both typical behavior and failure tails.
# Three model seeds per dataset separate sensitivity to model initialization and
# random test directions from variation in the generated data.
#
# 12 scenarios x 50 datasets x 3 model seeds x 13 models = 23,400 fits.
runner:
  _target_: experiments.runners.data_parallel_runner.DataParallelRunner
  _recursive_: false
  threads_limit: null
  num_datasets: 20
  model_seeds_per_dataset: 3
  n_jobs: 8
  backend: loky
  batch_size: auto

metrics:
  - _target_: experiments.metrics.ForwardKL
  - _target_: experiments.metrics.WeightsTV
  - _target_: experiments.metrics.MeansNormalizedError
  - _target_: experiments.metrics.CovariancesAffineInvariantError
  - _target_: experiments.metrics.AdjustedRandIndex

# All moment estimators use every observation as a base test center. Near-mean
# centers are additional probes, so their effect can be isolated from the
# amount of data-centered information.
moment_base: &moment_base
  _target_: src_np.gmm.MomentGaussianMixtureModel
  init: kmeans
  n_init: 10
  target_neighbor_counts: auto
  n_zero_moments: 1
  n_first_moments: 1
  n_second_moments: 1
  second_moment_mode: same_direction
  zero_moment_weight: 1.0
  first_moment_weight: 1.0
  second_moment_weight: 1.0
  normalize_moment_losses: true
  amplitude_optimization: simplex
  s_optimization: joint
  geometry_optimization: component
  test_center_mode: data
  n_test_centers: null
  test_center_noise_std: auto
  r_tests_near_means: 0.0
  alpha_std_tests: 0.1
  mean_penalty_weight: 0.0
  objective_rtol: 1.0e-6
  objective_atol: 0.0
  convergence_patience: 2
  max_steps: 30
  geom_sweeps: 1
  ls_max_nfev: 20
  active_tol: 1.0e-8
  eta_step_bound: 0.75
  m_step_bound: null

second_n3_w025: &second_n3_w025
  <<: *moment_base
  n_second_moments: 3
  second_moment_weight: 0.25

sklearn_gmm_kmeans: &sklearn_gmm_kmeans
  _target_: experiments.wrappers.SklearnGaussianMixtureWrapper
  init_mode: kmeans
  covariance_type: spherical
  tol: 1.0e-5
  reg_covar: 1.0e-6
  max_iter: 500
  kmeans_n_init: 10
  kmeans_max_iter: 300

sklearn_kmeans: &sklearn_kmeans
  _target_: experiments.wrappers.SklearnKMeansWrapper
  init_mode: kmeans
  n_init: 10
  max_iter: 300
  tol: 1.0e-4

models:
  # Full stabilization factorial at the original balanced moment setting. This
  # is the cleanest test of whether the mean penalty limits outlier leverage and
  # whether near-mean probes add a distinct robustness mechanism.
  - model_name: stab_balanced_none
    target:
      <<: *moment_base

  - model_name: stab_balanced_penalty
    target:
      <<: *moment_base
      mean_penalty_weight: 1.0e-3

  - model_name: stab_balanced_near
    target:
      <<: *moment_base
      r_tests_near_means: 1.0
      alpha_std_tests: 0.1

  - model_name: stab_balanced_both
    target:
      <<: *moment_base
      r_tests_near_means: 1.0
      alpha_std_tests: 0.1
      mean_penalty_weight: 1.0e-3

  # Repeat the same factorial at the tuned n_second=3, weight=0.25 point. The
  # unstabilized anchor is retained even though it was not a top clean-data
  # model, because causal interpretation of the three stabilized cells requires
  # it.
  - model_name: second_n3_w025
    target:
      <<: *second_n3_w025

  - model_name: stab_n3_w025_penalty
    target:
      <<: *second_n3_w025
      mean_penalty_weight: 1.0e-3

  - model_name: stab_n3_w025_near
    target:
      <<: *second_n3_w025
      r_tests_near_means: 1.0
      alpha_std_tests: 0.1

  - model_name: stab_n3_w025_both
    target:
      <<: *second_n3_w025
      r_tests_near_means: 1.0
      alpha_std_tests: 0.1
      mean_penalty_weight: 1.0e-3

  # Strongest boundary point from the second-moment grid. Comparing it with the
  # first-order-only control tests whether extra second-order information helps
  # under misspecification or merely amplifies heavy-tailed observations.
  - model_name: second_n5_w050
    target:
      <<: *moment_base
      n_second_moments: 5
      second_moment_weight: 0.50

  - model_name: moment_first_only3
    target:
      <<: *moment_base
      n_zero_moments: 0
      n_first_moments: 3
      n_second_moments: 0

  # Likelihood baselines and the initialization-only control are unchanged from
  # the clean-data experiment, enabling direct paired comparisons.
  - model_name: em_kmeans_reg1e6
    target:
      <<: *sklearn_gmm_kmeans

  - model_name: em_kmeans_reg1e2
    target:
      <<: *sklearn_gmm_kmeans
      reg_covar: 1.0e-2

  - model_name: kmeans_spherical
    target:
      <<: *sklearn_kmeans

# The canonical core exactly matches sample_d10_n500_hard_highvar_uniform from
# moments_robustness_ablation. The high-dimensional and imbalanced cores also
# match existing clean scenarios. Consequently, degradation relative to the
# previous run can be interpreted without introducing a new clean-data regime.
dataset_base: &dataset_base
  n_features: 10
  n_components: 3
  n_samples: 500
  covariance_type: spherical
  variance_spread: 6.0
  anisotropy: 1.0
  means_mode: fixed
  weights_concentration: 20.0
  min_mahalanobis_distance: 2.0

datasets:
  # Global heavy tails: unlike point contamination, every observation comes
  # from the misspecified Student-t component. df=3 is deliberately severe:
  # its covariance exists but its fourth moment does not.
  - name: student_t_df10_d10_n500_hard_uniform
    target:
      <<: *dataset_base
      _target_: experiments.synthetic_data.student_t.StudentTDatasetGenerator
      degrees_of_freedom: 10.0

  - name: student_t_df3_d10_n500_hard_uniform
    target:
      <<: *dataset_base
      _target_: experiments.synthetic_data.student_t.StudentTDatasetGenerator
      degrees_of_freedom: 3.0

  - name: student_t_df5_d30_n500_hard_uniform
    target:
      <<: *dataset_base
      _target_: experiments.synthetic_data.student_t.StudentTDatasetGenerator
      n_features: 30
      degrees_of_freedom: 5.0

  # Component-aligned scale contamination preserves component identity but
  # creates a two-scale distribution inside every component. The mild/severe
  # pair varies both frequency and leverage; the third cell tests whether small
  # mixture components are disproportionately damaged.
  - name: variance_eps002_x9_d10_n500_hard_uniform
    target:
      <<: *dataset_base
      _target_: experiments.synthetic_data.variance_contamination.VarianceContaminationDatasetGenerator
      contamination_fraction: 0.02
      variance_inflation: 9.0

  - name: variance_eps010_x100_d10_n500_hard_uniform
    target:
      <<: *dataset_base
      _target_: experiments.synthetic_data.variance_contamination.VarianceContaminationDatasetGenerator
      contamination_fraction: 0.10
      variance_inflation: 100.0

  - name: variance_eps005_x25_d10_n200_hard_imbalanced
    target:
      <<: *dataset_base
      _target_: experiments.synthetic_data.variance_contamination.VarianceContaminationDatasetGenerator
      n_samples: 200
      weights_concentration: 0.3
      contamination_fraction: 0.05
      variance_inflation: 25.0

  # Diffuse uniform background has no component identity. Padding controls how
  # far the background box extends beyond the clean mixture; high dimension is
  # included because uniform background geometry changes sharply with d.
  - name: uniform_eps002_pad2_d10_n500_hard_uniform
    target:
      <<: *dataset_base
      _target_: experiments.synthetic_data.uniform_background.UniformBackgroundDatasetGenerator
      contamination_fraction: 0.02
      box_padding: 2.0

  - name: uniform_eps010_pad8_d10_n500_hard_uniform
    target:
      <<: *dataset_base
      _target_: experiments.synthetic_data.uniform_background.UniformBackgroundDatasetGenerator
      contamination_fraction: 0.10
      box_padding: 8.0

  - name: uniform_eps005_pad4_d30_n500_hard_uniform
    target:
      <<: *dataset_base
      _target_: experiments.synthetic_data.uniform_background.UniformBackgroundDatasetGenerator
      n_features: 30
      contamination_fraction: 0.05
      box_padding: 4.0

  # Remote radial outliers are the direct gross-error stress test. Their shell
  # starts outside all component centers. The imbalanced cell tests component
  # stealing: a few coherent outliers can attract a fitted Gaussian away from a
  # low-weight genuine component.
  - name: radial_eps002_r4_6_d10_n500_hard_uniform
    target:
      <<: *dataset_base
      _target_: experiments.synthetic_data.radial_outliers.RadialOutlierDatasetGenerator
      contamination_fraction: 0.02
      min_radius_scale: 4.0
      max_radius_scale: 6.0

  - name: radial_eps010_r10_16_d10_n500_hard_uniform
    target:
      <<: *dataset_base
      _target_: experiments.synthetic_data.radial_outliers.RadialOutlierDatasetGenerator
      contamination_fraction: 0.10
      min_radius_scale: 10.0
      max_radius_scale: 16.0

  - name: radial_eps005_r6_10_d10_n200_hard_imbalanced
    target:
      <<: *dataset_base
      _target_: experiments.synthetic_data.radial_outliers.RadialOutlierDatasetGenerator
      n_samples: 200
      weights_concentration: 0.3
      contamination_fraction: 0.05
      min_radius_scale: 6.0
      max_radius_scale: 10.0
