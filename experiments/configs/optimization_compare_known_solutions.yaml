defaults:
  - metrics: optimization
  - aggregators: all
  - _self_

run_name: optimization_compare_known_solutions
save_dir: results
override: true
save_data_visualizations: true
num_visualization_samples: 3

runner:
  _target_: experiments.runners.data_parallel_runner.DataParallelRunner
  _recursive_: false
  threads_limit: null
  num_datasets: 20
  model_seeds_per_dataset: 5
  n_jobs: 4
  backend: loky
  batch_size: auto

np_oracle: &np_oracle
  _target_: experiments.wrappers.OracleInitWrapper
  init: null
  means_noise_coef: 0.1
  sigmas_noise_coef: 0.1
  n_init: 1
  mean_penalty_weight: 0.0
  num_directions: 2
  joint_optimization: false
  max_steps: 150

torch_linear: &torch_linear
  _target_: experiments.wrappers.TorchDimensionFreeLinearWrapper
  means_noise_coef: 0.1
  sigmas_noise_coef: 0.1
  num_directions: 2
  include_base_kernel: false
  loss_mode: euclidean
  relaxed_parametrization: false
  precompute_Z: true
  optimizer: lbfgs
  lr: 1.0
  max_steps: 20
  batch_size: null
  Z_batch_size: null

sklearn_gmm: &sklearn_gmm
  _target_: experiments.wrappers.SklearnGaussianMixtureWrapper
  means_noise_coef: 0.1
  sigmas_noise_coef: 0.1
  covariance_type: spherical
  tol: 1e-5
  reg_covar: 1e-6
  max_iter: 500

sklearn_kmeans: &sklearn_kmeans
  _target_: experiments.wrappers.SklearnKMeansWrapper
  means_noise_coef: 0.1
  sigmas_noise_coef: 0.1
  max_iter: 300
  tol: 1e-4

models:
  # Strong empirical moment baselines. 50 is close to the n=200 sweet spot,
  # 150 is close to n/(2K) for n=1000, and the schedule tests continuation.
  - model_name: np_one_s_50
    target:
      <<: *np_oracle
      target_neighbor_counts: [50]
  - model_name: np_one_s_150
    target:
      <<: *np_oracle
      target_neighbor_counts: [150]
  - model_name: np_decreasing_s_150_100_50
    target:
      <<: *np_oracle
      target_neighbor_counts: [150, 100, 50]
      max_steps: 50

  - model_name: torch_linear_one_s_50
    target:
      <<: *torch_linear
      target_neighbor_counts: [50]
  - model_name: torch_linear_one_s_150
    target:
      <<: *torch_linear
      target_neighbor_counts: [150]
  - model_name: torch_linear_multi_s_50_100_150
    target:
      <<: *torch_linear
      target_neighbor_counts: [50, 100, 150]

  - model_name: sklearn_gmm_oracle_init
    target:
      <<: *sklearn_gmm
  - model_name: sklearn_kmeans_oracle_init
    target:
      <<: *sklearn_kmeans

datasets:
  - name: spherical_bad_separated_n1000
    target:
      _target_: experiments.synthetic_data.sampler_core.DatasetGenerator
      n_features: 10
      n_components: 3
      n_samples: 1000
      covariance_type: spherical
      variance_spread: 1.5
      anisotropy: 1.0
      means_mode: fixed
      weights_concentration: 10.0
      min_mahalanobis_distance: 2.0
  - name: spherical_well_separated_n1000
    target:
      _target_: experiments.synthetic_data.sampler_core.DatasetGenerator
      n_features: 10
      n_components: 3
      n_samples: 1000
      covariance_type: spherical
      variance_spread: 1.5
      anisotropy: 1.0
      means_mode: fixed
      weights_concentration: 10.0
      min_mahalanobis_distance: 5.0
  - name: spherical_bad_separated_n200
    target:
      _target_: experiments.synthetic_data.sampler_core.DatasetGenerator
      n_features: 10
      n_components: 3
      n_samples: 200
      covariance_type: spherical
      variance_spread: 1.5
      anisotropy: 1.0
      means_mode: fixed
      weights_concentration: 10.0
      min_mahalanobis_distance: 2.0
  - name: spherical_well_separated_n200
    target:
      _target_: experiments.synthetic_data.sampler_core.DatasetGenerator
      n_features: 10
      n_components: 3
      n_samples: 200
      covariance_type: spherical
      variance_spread: 1.5
      anisotropy: 1.0
      means_mode: fixed
      weights_concentration: 10.0
      min_mahalanobis_distance: 5.0
