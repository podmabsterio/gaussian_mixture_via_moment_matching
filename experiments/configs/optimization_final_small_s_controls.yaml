defaults:
  - metrics: optimization
  - aggregators: all
  - datasets/10d_spherical_bad_separated@dataset_defs.spherical_bad_separated
  - _self_

run_name: optimization_final_small_s_controls
save_dir: results
override: true
save_data_visualizations: true
num_visualization_samples: 3

runner:
  _target_: experiments.runners.data_parallel_runner.DataParallelRunner
  _recursive_: false
  threads_limit: null
  num_datasets: 20
  model_seeds_per_dataset: 10
  n_jobs: 8
  backend: loky
  batch_size: auto

population_model: &population_model
  _target_: experiments.wrappers.PopulationWrapper
  init: null
  means_noise_coef: 0.1
  sigmas_noise_coef: 0.1
  n_init: 1
  mean_penalty_weight: 0.0
  num_directions: 2
  joint_optimization: false
  max_steps: 30

models:
  - model_name: one_s_30_steps_150
    target:
      <<: *population_model
      target_neighbor_counts: [30]
      max_steps: 150

  - model_name: one_s_5_steps_150
    target:
      <<: *population_model
      target_neighbor_counts: [5]
      max_steps: 150
  - model_name: one_s_5_steps_360
    target:
      <<: *population_model
      target_neighbor_counts: [5]
      max_steps: 360

  - model_name: one_s_3_steps_150
    target:
      <<: *population_model
      target_neighbor_counts: [3]
      max_steps: 150
  - model_name: one_s_3_steps_360
    target:
      <<: *population_model
      target_neighbor_counts: [3]
      max_steps: 360

  - model_name: one_s_2_steps_120
    target:
      <<: *population_model
      target_neighbor_counts: [2]
      max_steps: 120
  - model_name: one_s_2_steps_150
    target:
      <<: *population_model
      target_neighbor_counts: [2]
      max_steps: 150
  - model_name: one_s_2_steps_360
    target:
      <<: *population_model
      target_neighbor_counts: [2]
      max_steps: 360

  - model_name: decreasing_s_30_10_5_2
    target:
      <<: *population_model
      target_neighbor_counts: [30, 10, 5, 2]
      max_steps: 30
  - model_name: decreasing_s_50_20_10_5_2
    target:
      <<: *population_model
      target_neighbor_counts: [50, 20, 10, 5, 2]
      max_steps: 30
  - model_name: decreasing_s_200_50_10_2
    target:
      <<: *population_model
      target_neighbor_counts: [200, 50, 10, 2]
      max_steps: 30
  - model_name: decreasing_s_200_to_2
    target:
      <<: *population_model
      target_neighbor_counts: [200, 100, 70, 50, 30, 20, 15, 10, 7, 5, 3, 2]
      max_steps: 30

datasets:
  - ${dataset_defs.spherical_bad_separated}
