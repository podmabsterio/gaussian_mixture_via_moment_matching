defaults:
  - aggregators: all
  - _self_

run_name: moments_student_t_equal_budget_confirmation
save_dir: results
override: true
save_data_visualizations: false
num_visualization_samples: 0

# Confirmatory transfer of the uniform-background equal-budget experiment to
# globally heavy-tailed data.  Every observation now comes from one of three
# moment-matched Student-t components; this is model misspecification rather
# than an explicitly labelled point-contamination mechanism.
#
# The model grid and optimization settings exactly match
# moments_uniform_background_equal_budget_confirmation.  In particular, every
# moment model constructs the same one zero-order, ten first-order, and ten
# second-order probes at target neighbor counts [17, 133].  Inactive families
# retain their probes and are disabled only by a zero loss weight.  The legacy
# optimizer is selected explicitly so the separated-variance experiments do
# not affect this comparison.
#
# Dataset seeds 101--160 and model seeds 1--3 match the article's uniform-noise
# confirmation.  For a fixed dataset seed the latent Gaussian target (means,
# covariances, weights, and component labels) is therefore paired with the
# existing clean/uniform results, while the observed Student-t sample is new.
# The already-computed Gaussian endpoint is not rerun.
#
# df=10 is a mild heavy-tail condition; df=5 has a finite fourth moment but
# visibly heavier tails; df=3 is severe and has finite covariance but infinite
# fourth moment.
#
# 3 datasets x 60 dataset seeds x 3 model seeds x 12 models = 6,480 fits.
runner:
  _target_: experiments.runners.data_parallel_runner.DataParallelRunner
  _recursive_: false
  threads_limit: null
  num_datasets: 60
  dataset_seed_start: 101
  model_seeds_per_dataset: 3
  save_raw_results: true
  n_jobs: 8
  backend: loky
  batch_size: auto

# Forward KL and parameter errors compare the fitted spherical Gaussian model
# with the moment-matched Gaussian target of each Student-t mixture.  Every
# observation retains its component identity, so ARI uses the complete sample.
metrics:
  - _target_: experiments.metrics.FinalLoss
  - _target_: experiments.metrics.RelativeLossDrop
  - _target_: experiments.metrics.ForwardKL
  - _target_: experiments.metrics.WeightsTV
  - _target_: experiments.metrics.MeansNormalizedError
  - _target_: experiments.metrics.CovariancesAffineInvariantError
  - _target_: experiments.metrics.AdjustedRandIndex
  - _target_: experiments.metrics.MinimumSelectedBandwidth
  - _target_: experiments.metrics.MaximumSelectedBandwidth
  - _target_: experiments.metrics.MinimumEstimatedWeight
  - _target_: experiments.metrics.EstimatedVarianceRatio

moment_equal_budget: &moment_equal_budget
  _target_: src_np.gmm.MomentGaussianMixtureModel
  init: kmeans
  n_init: 10
  target_neighbor_counts: [17, 133]
  n_zero_moments: 1
  n_first_moments: 10
  n_second_moments: 10
  second_moment_mode: same_direction
  zero_moment_weight: 0.0
  first_moment_weight: 0.0
  second_moment_weight: 1.0
  normalize_moment_losses: true
  scale_normalize_moments: true
  leave_one_out: true
  amplitude_optimization: simplex
  s_optimization: joint
  geometry_optimization: component
  optimizer_mode: legacy
  test_center_mode: data
  n_test_centers: null
  test_center_fraction: 1.0
  test_center_noise_std: auto
  r_tests_near_means: 0.0
  alpha_std_tests: 0.1
  mean_penalty_weight: 0.0
  objective_rtol: 1.0e-5
  objective_atol: 0.0
  convergence_patience: 3
  max_steps: 150
  geom_sweeps: 1
  ls_max_nfev: 30
  active_tol: 1.0e-8
  eta_step_bound: 0.75
  m_step_bound: null

sklearn_gmm_kmeans: &sklearn_gmm_kmeans
  _target_: experiments.wrappers.SklearnGaussianMixtureWrapper
  init_mode: kmeans
  covariance_type: spherical
  tol: 1.0e-5
  reg_covar: 1.0e-6
  max_iter: 500
  kmeans_n_init: 10
  kmeans_max_iter: 300

sklearn_kmeans: &sklearn_kmeans
  _target_: experiments.wrappers.SklearnKMeansWrapper
  init_mode: kmeans
  n_init: 10
  max_iter: 300
  tol: 1.0e-4

models:
  # Exact first-moment weight path from the article experiment.  Reusing the
  # complete path tests whether the pseudo-true optimum under global heavy
  # tails favors a different moment balance than diffuse uniform replacement.
  - model_name: equal_budget_w0_0_w1_0_w2_1
    target:
      <<: *moment_equal_budget

  - model_name: equal_budget_w0_0_w1_003125_w2_1
    target:
      <<: *moment_equal_budget
      first_moment_weight: 0.03125

  - model_name: equal_budget_w0_0_w1_00625_w2_1
    target:
      <<: *moment_equal_budget
      first_moment_weight: 0.0625

  - model_name: equal_budget_w0_0_w1_0125_w2_1
    target:
      <<: *moment_equal_budget
      first_moment_weight: 0.125

  - model_name: equal_budget_w0_0_w1_025_w2_1
    target:
      <<: *moment_equal_budget
      first_moment_weight: 0.25

  - model_name: equal_budget_w0_0_w1_05_w2_1
    target:
      <<: *moment_equal_budget
      first_moment_weight: 0.5

  - model_name: equal_budget_w0_0_w1_1_w2_1
    target:
      <<: *moment_equal_budget
      first_moment_weight: 1.0

  - model_name: equal_budget_w0_0_w1_1_w2_0
    target:
      <<: *moment_equal_budget
      first_moment_weight: 1.0
      second_moment_weight: 0.0

  - model_name: equal_budget_w0_00625_w1_0_w2_1
    target:
      <<: *moment_equal_budget
      zero_moment_weight: 0.0625

  - model_name: em_kmeans_reg1e6
    target:
      <<: *sklearn_gmm_kmeans

  - model_name: em_kmeans_reg1e2
    target:
      <<: *sklearn_gmm_kmeans
      reg_covar: 1.0e-2

  - model_name: kmeans_spherical
    target:
      <<: *sklearn_kmeans

dataset_base: &dataset_base
  _target_: experiments.synthetic_data.student_t.StudentTDatasetGenerator
  n_features: 10
  n_components: 3
  n_samples: 200
  covariance_type: spherical
  variance_spread: 3.0
  anisotropy: 1.0
  means_mode: fixed
  weights_concentration: 1000000.0
  min_mahalanobis_distance: 2.0

datasets:
  - name: student_t_df10_d10_n200_hard_varspread3
    target:
      <<: *dataset_base
      degrees_of_freedom: 10.0

  - name: student_t_df5_d10_n200_hard_varspread3
    target:
      <<: *dataset_base
      degrees_of_freedom: 5.0

  - name: student_t_df3_d10_n200_hard_varspread3
    target:
      <<: *dataset_base
      degrees_of_freedom: 3.0
