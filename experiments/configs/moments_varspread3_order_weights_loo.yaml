defaults:
  - aggregators: all
  - _self_

run_name: moments_varspread3_order_weights_loo
save_dir: results
override: true
save_data_visualizations: false
num_visualization_samples: 0

# Moment-family weight factorial at the bandwidth pair selected by
# moments_varspread3_bandwidth_loo.  The first-order family fixes the objective
# scale at w1=1; only relative weights are identifiable.  Moment counts remain
# (1, 3, 3) even when a family weight is zero so every cell uses identical test
# centers and random directions for a given dataset/model seed.
#
# 1 dataset x 30 dataset draws x 2 model seeds x 20 models = 1,200 fits.
runner:
  _target_: experiments.runners.data_parallel_runner.DataParallelRunner
  _recursive_: false
  threads_limit: null
  num_datasets: 30
  model_seeds_per_dataset: 2
  n_jobs: 8
  backend: loky
  batch_size: auto

# Final loss and relative loss drop are optimization diagnostics only.  Their
# absolute values must not be compared between different weight cells.
metrics:
  - _target_: experiments.metrics.FinalLoss
  - _target_: experiments.metrics.RelativeLossDrop
  - _target_: experiments.metrics.ForwardKL
  - _target_: experiments.metrics.WeightsTV
  - _target_: experiments.metrics.MeansNormalizedError
  - _target_: experiments.metrics.CovariancesAffineInvariantError
  - _target_: experiments.metrics.AdjustedRandIndex

moment_base: &moment_base
  _target_: src_np.gmm.MomentGaussianMixtureModel
  init: kmeans
  n_init: 10
  target_neighbor_counts: [17, 133]
  n_zero_moments: 1
  n_first_moments: 3
  n_second_moments: 3
  second_moment_mode: same_direction
  zero_moment_weight: 0.0
  first_moment_weight: 1.0
  second_moment_weight: 0.0
  normalize_moment_losses: true
  scale_normalize_moments: true
  leave_one_out: true
  amplitude_optimization: simplex
  s_optimization: joint
  geometry_optimization: component
  test_center_mode: data
  n_test_centers: null
  test_center_fraction: 1.0
  test_center_noise_std: auto
  r_tests_near_means: 0.0
  alpha_std_tests: 0.1
  mean_penalty_weight: 0.0
  objective_rtol: 1.0e-5
  objective_atol: 0.0
  convergence_patience: 3
  max_steps: 150
  geom_sweeps: 1
  ls_max_nfev: 30
  active_tol: 1.0e-8
  eta_step_bound: 0.75
  m_step_bound: null

sklearn_gmm_kmeans: &sklearn_gmm_kmeans
  _target_: experiments.wrappers.SklearnGaussianMixtureWrapper
  init_mode: kmeans
  covariance_type: spherical
  tol: 1.0e-5
  reg_covar: 1.0e-6
  max_iter: 500
  kmeans_n_init: 10
  kmeans_max_iter: 300

sklearn_kmeans: &sklearn_kmeans
  _target_: experiments.wrappers.SklearnKMeansWrapper
  init_mode: kmeans
  n_init: 10
  max_iter: 300
  tol: 1.0e-4

models:
  # w0 = 0.  This row contains the first-only endpoint and the zero-free
  # first+second sweep.
  - model_name: weights_s_n17_n133_w0_0_w1_1_w2_0
    target:
      <<: *moment_base

  - model_name: weights_s_n17_n133_w0_0_w1_1_w2_025
    target:
      <<: *moment_base
      second_moment_weight: 0.25

  - model_name: weights_s_n17_n133_w0_0_w1_1_w2_1
    target:
      <<: *moment_base
      second_moment_weight: 1.0

  - model_name: weights_s_n17_n133_w0_0_w1_1_w2_4
    target:
      <<: *moment_base
      second_moment_weight: 4.0

  # w0 = 1/16.
  - model_name: weights_s_n17_n133_w0_00625_w1_1_w2_0
    target:
      <<: *moment_base
      zero_moment_weight: 0.0625

  - model_name: weights_s_n17_n133_w0_00625_w1_1_w2_025
    target:
      <<: *moment_base
      zero_moment_weight: 0.0625
      second_moment_weight: 0.25

  - model_name: weights_s_n17_n133_w0_00625_w1_1_w2_1
    target:
      <<: *moment_base
      zero_moment_weight: 0.0625
      second_moment_weight: 1.0

  - model_name: weights_s_n17_n133_w0_00625_w1_1_w2_4
    target:
      <<: *moment_base
      zero_moment_weight: 0.0625
      second_moment_weight: 4.0

  # w0 = 1/4.
  - model_name: weights_s_n17_n133_w0_025_w1_1_w2_0
    target:
      <<: *moment_base
      zero_moment_weight: 0.25

  - model_name: weights_s_n17_n133_w0_025_w1_1_w2_025
    target:
      <<: *moment_base
      zero_moment_weight: 0.25
      second_moment_weight: 0.25

  - model_name: weights_s_n17_n133_w0_025_w1_1_w2_1
    target:
      <<: *moment_base
      zero_moment_weight: 0.25
      second_moment_weight: 1.0

  - model_name: weights_s_n17_n133_w0_025_w1_1_w2_4
    target:
      <<: *moment_base
      zero_moment_weight: 0.25
      second_moment_weight: 4.0

  # w0 = 1.
  - model_name: weights_s_n17_n133_w0_1_w1_1_w2_0
    target:
      <<: *moment_base
      zero_moment_weight: 1.0

  - model_name: weights_s_n17_n133_w0_1_w1_1_w2_025
    target:
      <<: *moment_base
      zero_moment_weight: 1.0
      second_moment_weight: 0.25

  - model_name: weights_s_n17_n133_w0_1_w1_1_w2_1
    target:
      <<: *moment_base
      zero_moment_weight: 1.0
      second_moment_weight: 1.0

  - model_name: weights_s_n17_n133_w0_1_w1_1_w2_4
    target:
      <<: *moment_base
      zero_moment_weight: 1.0
      second_moment_weight: 4.0

  # Second-only endpoint.  Keeping n_first_moments=3 with zero weight makes its
  # second-order random directions identical to those in the factorial cells.
  - model_name: weights_s_n17_n133_w0_0_w1_0_w2_1
    target:
      <<: *moment_base
      first_moment_weight: 0.0
      second_moment_weight: 1.0

  - model_name: em_kmeans_reg1e6
    target:
      <<: *sklearn_gmm_kmeans

  - model_name: em_kmeans_reg1e2
    target:
      <<: *sklearn_gmm_kmeans
      reg_covar: 1.0e-2

  - model_name: kmeans_spherical
    target:
      <<: *sklearn_kmeans

datasets:
  - name: balanced_d10_n200_hard_varspread3
    target:
      _target_: experiments.synthetic_data.gaussian.GaussianDatasetGenerator
      n_features: 10
      n_components: 3
      n_samples: 200
      covariance_type: spherical
      variance_spread: 3.0
      anisotropy: 1.0
      means_mode: fixed
      weights_concentration: 1.0e6
      min_mahalanobis_distance: 2.0
