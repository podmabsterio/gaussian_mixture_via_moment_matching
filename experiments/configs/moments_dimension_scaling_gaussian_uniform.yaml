defaults:
  - aggregators: all
  - _self_

run_name: moments_dimension_scaling_gaussian_uniform
save_dir: results
override: true
save_data_visualizations: false
num_visualization_samples: 0

# Exploratory dimension-scaling experiment for the article's main spherical
# mixture regime.  The only dataset factor changed inside each clean/uniform
# pair is d in {2, 10, 50, 100, 500}.  Sample size follows
# n(d) = max(200, 20*d), giving n = {200, 200, 1000, 2000, 10000}.  This keeps
# the leading mean-estimation difficulty sqrt(d / n_k) approximately constant
# from the article anchor d=10, n=200 onward.  K=3, variance spread 3,
# separation, and the 5% diffuse-uniform contamination mechanism remain fixed.
#
# Three moment configurations summarize the useful part of the confirmatory
# equal-budget path:
#   M2 only             -- best robust endpoint at 5% and 10% uniform noise;
#   M2 + (1/32) M1      -- smallest positive-M1 contaminated-data candidate;
#   M2 + (1/4) M1       -- best clean-data equal-budget candidate.
# All three construct exactly the same 1 M0 + 10 M1 + 10 M2 test-function
# stream; inactive M0/M1 families are disabled only by their loss weights.
# Legacy optimization is selected explicitly.
#
# The original neighbor targets are converted to fractions 17/199 and 133/199,
# so every sample size uses the same relative local/wide bandwidths.  Only 100
# data-derived test centers are sampled for every fit.  This preserves 2000
# active M2 equations across dimensions (still more than the 1505 mixture
# parameters at d=500) without making the number of tests grow with n.
#
# Three new dataset seeds and one model seed deliberately make this a compact
# exploratory screen.  Pairwise comparisons across models and clean/uniform
# conditions retain the same dataset seeds.  Restricting each worker to one
# numerical thread prevents oversubscription in the high-dimensional cells.
#
# 10 dataset cells x 3 dataset seeds x 1 model seed x 6 models = 180 fits.
runner:
  _target_: experiments.runners.data_parallel_runner.DataParallelRunner
  _recursive_: false
  threads_limit: 1
  num_datasets: 20
  dataset_seed_start: 301
  model_seeds_per_dataset: 1
  save_raw_results: true
  n_jobs: 3
  backend: loky
  batch_size: auto

# Parameter and density metrics always target the latent Gaussian mixture.
# For uniform-background cells, ARI excludes the ten replaced observations,
# while every estimator is fitted on all 200 observations.
metrics:
  - _target_: experiments.metrics.FinalLoss
  - _target_: experiments.metrics.RelativeLossDrop
  - _target_: experiments.metrics.ForwardKL
  - _target_: experiments.metrics.WeightsTV
  - _target_: experiments.metrics.MeansNormalizedError
  - _target_: experiments.metrics.CovariancesAffineInvariantError
  - _target_: experiments.metrics.AdjustedRandIndex
  - _target_: experiments.metrics.MinimumSelectedBandwidth
  - _target_: experiments.metrics.MaximumSelectedBandwidth
  - _target_: experiments.metrics.MinimumEstimatedWeight
  - _target_: experiments.metrics.EstimatedVarianceRatio

moment_equal_budget: &moment_equal_budget
  _target_: src_np.gmm.MomentGaussianMixtureModel
  init: kmeans
  n_init: 10
  target_neighbor_counts: null
  target_neighbor_fractions: [0.08542713567839195, 0.6683417085427136]
  n_zero_moments: 1
  n_first_moments: 10
  n_second_moments: 10
  second_moment_mode: same_direction
  zero_moment_weight: 0.0
  first_moment_weight: 0.0
  second_moment_weight: 1.0
  normalize_moment_losses: true
  scale_normalize_moments: true
  leave_one_out: true
  amplitude_optimization: simplex
  s_optimization: joint
  geometry_optimization: component
  optimizer_mode: legacy
  test_center_mode: data
  n_test_centers: 100
  test_center_fraction: 1.0
  test_center_noise_std: auto
  r_tests_near_means: 0.0
  alpha_std_tests: 0.1
  mean_penalty_weight: 0.0
  objective_rtol: 1.0e-5
  objective_atol: 0.0
  convergence_patience: 3
  max_steps: 150
  geom_sweeps: 1
  ls_max_nfev: 30
  active_tol: 1.0e-8
  eta_step_bound: 0.75
  m_step_bound: null

sklearn_gmm_kmeans: &sklearn_gmm_kmeans
  _target_: experiments.wrappers.SklearnGaussianMixtureWrapper
  init_mode: kmeans
  covariance_type: spherical
  tol: 1.0e-5
  reg_covar: 1.0e-6
  max_iter: 500
  kmeans_n_init: 10
  kmeans_max_iter: 300

sklearn_kmeans: &sklearn_kmeans
  _target_: experiments.wrappers.SklearnKMeansWrapper
  init_mode: kmeans
  n_init: 10
  max_iter: 300
  tol: 1.0e-4

models:
  - model_name: equal_budget_w0_0_w1_0_w2_1
    target:
      <<: *moment_equal_budget

  - model_name: equal_budget_w0_0_w1_003125_w2_1
    target:
      <<: *moment_equal_budget
      first_moment_weight: 0.03125

  - model_name: equal_budget_w0_0_w1_025_w2_1
    target:
      <<: *moment_equal_budget
      first_moment_weight: 0.25

  - model_name: em_kmeans_reg1e6
    target:
      <<: *sklearn_gmm_kmeans

  - model_name: em_kmeans_reg1e2
    target:
      <<: *sklearn_gmm_kmeans
      reg_covar: 1.0e-2

  - model_name: kmeans_spherical
    target:
      <<: *sklearn_kmeans

gaussian_base: &gaussian_base
  _target_: experiments.synthetic_data.gaussian.GaussianDatasetGenerator
  n_features: 10
  n_components: 3
  n_samples: 200
  covariance_type: spherical
  variance_spread: 3.0
  anisotropy: 1.0
  means_mode: fixed
  weights_concentration: 1000000.0
  min_mahalanobis_distance: 2.0

uniform_base: &uniform_base
  <<: *gaussian_base
  _target_: experiments.synthetic_data.uniform_background.UniformBackgroundDatasetGenerator
  contamination_fraction: 0.05
  box_padding: 4.0

datasets:
  - name: gaussian_d2_n200_hard_varspread3
    target:
      <<: *gaussian_base
      n_features: 2

  - name: uniform_eps005_pad4_d2_n200_hard_varspread3
    target:
      <<: *uniform_base
      n_features: 2

  - name: gaussian_d10_n200_hard_varspread3
    target:
      <<: *gaussian_base
      n_features: 10

  - name: uniform_eps005_pad4_d10_n200_hard_varspread3
    target:
      <<: *uniform_base
      n_features: 10

  - name: gaussian_d50_n1000_hard_varspread3
    target:
      <<: *gaussian_base
      n_features: 50
      n_samples: 1000

  - name: uniform_eps005_pad4_d50_n1000_hard_varspread3
    target:
      <<: *uniform_base
      n_features: 50
      n_samples: 1000

  - name: gaussian_d100_n2000_hard_varspread3
    target:
      <<: *gaussian_base
      n_features: 100
      n_samples: 2000

  - name: uniform_eps005_pad4_d100_n2000_hard_varspread3
    target:
      <<: *uniform_base
      n_features: 100
      n_samples: 2000

  - name: gaussian_d500_n10000_hard_varspread3
    target:
      <<: *gaussian_base
      n_features: 500
      n_samples: 10000

  - name: uniform_eps005_pad4_d500_n10000_hard_varspread3
    target:
      <<: *uniform_base
      n_features: 500
      n_samples: 10000
