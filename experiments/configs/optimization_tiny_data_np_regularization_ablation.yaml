defaults:
  - metrics: optimization
  - aggregators: all
  - _self_

run_name: optimization_tiny_data_np_regularization_ablation
save_dir: results
override: true
save_data_visualizations: true
num_visualization_samples: 3

runner:
  _target_: experiments.runners.data_parallel_runner.DataParallelRunner
  _recursive_: false
  threads_limit: null
  num_datasets: 50
  model_seeds_per_dataset: 3
  n_jobs: 4
  backend: loky
  batch_size: auto

np_moment_kmeans: &np_moment_kmeans
  _target_: src_np.gmm.OneSGaussianMixtureModel
  init: kmeans
  n_init: 10
  target_neighbor_counts: auto
  mean_penalty_weight: 0.0
  r_tests_near_means: 0.0
  alpha_std_tests: 0.1
  num_directions: 2
  joint_optimization: false
  max_steps: 50

sklearn_gmm_kmeans: &sklearn_gmm_kmeans
  _target_: experiments.wrappers.SklearnGaussianMixtureWrapper
  init_mode: kmeans
  covariance_type: spherical
  tol: 1e-5
  reg_covar: 1e-6
  max_iter: 500
  kmeans_n_init: 10
  kmeans_max_iter: 300

sklearn_kmeans: &sklearn_kmeans
  _target_: experiments.wrappers.SklearnKMeansWrapper
  init_mode: kmeans
  n_init: 10
  max_iter: 300
  tol: 1e-4

models:
  # Baseline: neither of the two proposed stabilizers.
  - model_name: np_base
    target:
      <<: *np_moment_kmeans

  # Test-center stabilizer only. r controls how many synthetic core probes are added.
  - model_name: np_near_r05_a01
    target:
      <<: *np_moment_kmeans
      r_tests_near_means: 0.5
      alpha_std_tests: 0.1
  - model_name: np_near_r1_a01
    target:
      <<: *np_moment_kmeans
      r_tests_near_means: 1.0
      alpha_std_tests: 0.1
  - model_name: np_near_r2_a01
    target:
      <<: *np_moment_kmeans
      r_tests_near_means: 2.0
      alpha_std_tests: 0.1

  # Radius sensitivity at the middle r. Small alpha is more anchor-like;
  # larger alpha asks whether local core probes need wider support.
  - model_name: np_near_r1_a005
    target:
      <<: *np_moment_kmeans
      r_tests_near_means: 1.0
      alpha_std_tests: 0.05
  - model_name: np_near_r1_a025
    target:
      <<: *np_moment_kmeans
      r_tests_near_means: 1.0
      alpha_std_tests: 0.25

  # Mean-anchor stabilizer only. The scale is intentionally logarithmic:
  # earlier losses were tiny, so overly large penalties can freeze k-means.
  - model_name: np_penalty_1em4
    target:
      <<: *np_moment_kmeans
      mean_penalty_weight: 1e-4
  - model_name: np_penalty_1em3
    target:
      <<: *np_moment_kmeans
      mean_penalty_weight: 1e-3
  - model_name: np_penalty_1em2
    target:
      <<: *np_moment_kmeans
      mean_penalty_weight: 1e-2

  # Joint tests: same core probes plus a penalty sweep.
  - model_name: np_near_r1_a01_penalty_1em4
    target:
      <<: *np_moment_kmeans
      r_tests_near_means: 1.0
      alpha_std_tests: 0.1
      mean_penalty_weight: 1e-4
  - model_name: np_near_r1_a01_penalty_1em3
    target:
      <<: *np_moment_kmeans
      r_tests_near_means: 1.0
      alpha_std_tests: 0.1
      mean_penalty_weight: 1e-3
  - model_name: np_near_r1_a01_penalty_1em2
    target:
      <<: *np_moment_kmeans
      r_tests_near_means: 1.0
      alpha_std_tests: 0.1
      mean_penalty_weight: 1e-2
  - model_name: np_near_r2_a01_penalty_1em3
    target:
      <<: *np_moment_kmeans
      r_tests_near_means: 2.0
      alpha_std_tests: 0.1
      mean_penalty_weight: 1e-3

  # External baselines: not part of the ablation, but essential for calibration.
  - model_name: sklearn_gmm_kmeans
    target:
      <<: *sklearn_gmm_kmeans
  - model_name: sklearn_kmeans
    target:
      <<: *sklearn_kmeans

datasets:
