    target:
      <<: *population_model
      means_noise_coef: 0.1
      sigmas_noise_coef: 0.1
      target_neighbor_counts: [30]
      max_steps: 150
  - model_name: noise_010_decreasing_s_200_70_30
    target:
      <<: *population_model
      means_noise_coef: 0.1
      sigmas_noise_coef: 0.1
      target_neighbor_counts: [200, 70, 30]
  # - model_name: noise_020_one_s_30
  #   target:
  #     <<: *population_model
  #     means_noise_coef: 0.2
  #     sigmas_noise_coef: 0.2
  #     target_neighbor_counts: [30]
  - model_name: noise_020_one_s_30_steps_150
    target:
      <<: *population_model
      means_noise_coef: 0.2
      sigmas_noise_coef: 0.2
      target_neighbor_counts: [30]
      max_steps: 150
  - model_name: noise_020_decreasing_s_200_70_30
    target:
      <<: *population_model
      means_noise_coef: 0.2
      sigmas_noise_coef: 0.2
      target_neighbor_counts: [200, 70, 30]
  # - model_name: noise_050_one_s_30
  #   target:
  #     <<: *population_model
  #     means_noise_coef: 0.5
  #     sigmas_noise_coef: 0.5
  #     target_neighbor_counts: [30]
  - model_name: noise_050_one_s_30_steps_150
    target:
      <<: *population_model
      means_noise_coef: 0.5
      sigmas_noise_coef: 0.5
      target_neighbor_counts: [30]
      max_steps: 150
  - model_name: noise_050_decreasing_s_200_70_30
    target:
      <<: *population_model
      means_noise_coef: 0.5
      sigmas_noise_coef: 0.5
      target_neighbor_counts: [200, 70, 30]
  - model_name: noise_10_one_s_30_steps_150
    target:
      <<: *population_model
      means_noise_coef: 1.0
      sigmas_noise_coef: 1.0
      target_neighbor_counts: [30]
      max_steps: 150
  - model_name: noise_10_decreasing_s_200_70_30
    target:
      <<: *population_model
      means_noise_coef: 1.0
      sigmas_noise_coef: 1.0
      target_neighbor_counts: [200, 70, 30]

datasets:
  - ${dataset_defs.spherical_bad_separated}
  - ${dataset_defs.spherical_well_separated}
  
