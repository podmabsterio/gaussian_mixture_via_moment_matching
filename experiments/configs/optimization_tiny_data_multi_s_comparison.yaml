defaults:
  - metrics: optimization
  - aggregators: all
  - _self_

run_name: optimization_tiny_data_multi_s_comparison
save_dir: results
override: true
save_data_visualizations: true
num_visualization_samples: 3

runner:
  _target_: experiments.runners.data_parallel_runner.DataParallelRunner
  _recursive_: false
  threads_limit: null
  num_datasets: 50
  model_seeds_per_dataset: 3
  n_jobs: 4
  backend: loky
  batch_size: auto

one_s_kmeans: &one_s_kmeans
  _target_: src_np.gmm.OneSGaussianMixtureModel
  init: kmeans
  n_init: 10
  target_neighbor_counts: auto
  mean_penalty_weight: 0.0
  r_tests_near_means: 0.0
  alpha_std_tests: 0.1
  include_base_kernel: false
  num_directions: 3
  joint_optimization: false
  max_steps: 50

multi_s_kmeans: &multi_s_kmeans
  _target_: src_np.gmm.MultiSGaussianMixtureModel
  init: kmeans
  n_init: 10
  target_neighbor_counts: auto
  mean_penalty_weight: 0.0
  r_tests_near_means: 0.0
  alpha_std_tests: 0.1
  include_base_kernel: false
  num_directions: 3
  joint_optimization: false
  max_steps: 50

sklearn_gmm_kmeans: &sklearn_gmm_kmeans
  _target_: experiments.wrappers.SklearnGaussianMixtureWrapper
  init_mode: kmeans
  covariance_type: spherical
  tol: 1e-5
  reg_covar: 1e-6
  max_iter: 500
  kmeans_n_init: 10
  kmeans_max_iter: 300

sklearn_kmeans: &sklearn_kmeans
  _target_: experiments.wrappers.SklearnKMeansWrapper
  init_mode: kmeans
  n_init: 10
  max_iter: 300
  tol: 1e-4

models:
  # Main question: sequential continuation over auto s-values vs one joint
  # multi-s objective with shared means/sigmas and scale-specific amplitudes.
  - model_name: one_seq_lin3
    target:
      <<: *one_s_kmeans
      num_directions: 3
      include_base_kernel: false
  - model_name: multi_lin3
    target:
      <<: *multi_s_kmeans
      num_directions: 3
      include_base_kernel: false

  # Equal row-budget base comparison: 3 linear rows vs 1 base + 2 linear rows.
  - model_name: one_seq_base1_lin2
    target:
      <<: *one_s_kmeans
      num_directions: 2
      include_base_kernel: true
  - model_name: multi_base1_lin2
    target:
      <<: *multi_s_kmeans
      num_directions: 2
      include_base_kernel: true

  # Near-center probes were the most reliable single improvement.
  # alpha=0.05 was strongest in well-separated regimes.
  - model_name: one_seq_lin3_near_r1_a005
    target:
      <<: *one_s_kmeans
      num_directions: 3
      include_base_kernel: false
      r_tests_near_means: 1.0
      alpha_std_tests: 0.05
  - model_name: multi_lin3_near_r1_a005
    target:
      <<: *multi_s_kmeans
      num_directions: 3
      include_base_kernel: false
      r_tests_near_means: 1.0
      alpha_std_tests: 0.05

  - model_name: one_seq_base1_lin2_near_r1_a005
    target:
      <<: *one_s_kmeans
      num_directions: 2
      include_base_kernel: true
      r_tests_near_means: 1.0
      alpha_std_tests: 0.05
  - model_name: multi_base1_lin2_near_r1_a005
    target:
      <<: *multi_s_kmeans
      num_directions: 2
      include_base_kernel: true
      r_tests_near_means: 1.0
      alpha_std_tests: 0.05

  # r=0.5, alpha=0.1 was strongest in bad-separated small-data regimes.
  - model_name: one_seq_lin2_near_r05_a01
    target:
      <<: *one_s_kmeans
      num_directions: 2
      include_base_kernel: false
      r_tests_near_means: 0.5
      alpha_std_tests: 0.1
  - model_name: multi_lin2_near_r05_a01
    target:
      <<: *multi_s_kmeans
      num_directions: 2
      include_base_kernel: false
      r_tests_near_means: 0.5
      alpha_std_tests: 0.1

  # Mean penalty helped alone in hard well-separated cases. This tests whether
  # multi-s turns that stabilizer into genuine scale recovery rather than drift.
  - model_name: one_seq_lin3_near_r1_a005_penalty_1em2
    target:
      <<: *one_s_kmeans
      num_directions: 3
      include_base_kernel: false
      r_tests_near_means: 1.0
      alpha_std_tests: 0.05
      mean_penalty_weight: 1e-2
  - model_name: multi_lin3_near_r1_a005_penalty_1em2
    target:
      <<: *multi_s_kmeans
      num_directions: 3
      include_base_kernel: false
      r_tests_near_means: 1.0
      alpha_std_tests: 0.05
      mean_penalty_weight: 1e-2

  # Base was not good as a standalone replacement, but helped in the most
  # regularized base-kernel ablation. Keep exactly that stress test.
  - model_name: one_seq_base1_lin2_near_r1_a005_penalty_1em2
    target:
      <<: *one_s_kmeans
      num_directions: 2
      include_base_kernel: true
      r_tests_near_means: 1.0
      alpha_std_tests: 0.05
      mean_penalty_weight: 1e-2
  - model_name: multi_base1_lin2_near_r1_a005_penalty_1em2
    target:
      <<: *multi_s_kmeans
      num_directions: 2
      include_base_kernel: true
      r_tests_near_means: 1.0
      alpha_std_tests: 0.05
      mean_penalty_weight: 1e-2

  - model_name: sklearn_gmm_kmeans
    target:
      <<: *sklearn_gmm_kmeans
  - model_name: sklearn_kmeans
    target:
      <<: *sklearn_kmeans

