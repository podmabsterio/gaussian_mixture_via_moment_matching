defaults:
  - aggregators: all
  - _self_

run_name: moments_radial_second_uniform_contamination
save_dir: results
override: true
save_data_visualizations: false
num_visualization_samples: 0

# First radial-second-moment experiment under diffuse uniform contamination.
# It uses exactly the contaminated dataset designs and repetitions from
# moments_uniform_background_equal_budget_confirmation: dataset seeds 101--160
# and model seeds 1--3.  The already available directional-M2, mixed-M1, EM,
# and KMeans rows are references only and are deliberately not rerun.
#
# Hypotheses:
#   H1. Compensation suppresses the approximately uniform background response.
#   H2. A small first-order weight helps at eps=2%, but becomes harmful by
#       eps=5--10%, as it did with directional M2.
#   H3. A fixed-total-weight directional/radial hybrid can preserve angular
#       localization while adding a lower-noise isotropic scale constraint.
#
# The endpoints form a fixed second-order weight path:
#
#   old directional M2       new hybrid             new radial
#   (w2, wR) = (1, 0)  ->  (0.5, 0.5)  ->  (0, 1).
#
# Existing paired references are in
# results/moments_uniform_background_equal_budget_confirmation/<dataset>/raw.csv:
#   equal_budget_w0_0_w1_0_w2_1,
#   equal_budget_w0_0_w1_003125_w2_1,
#   equal_budget_w0_0_w1_0125_w2_1,
#   em_kmeans_reg1e2, and kmeans_spherical.
#
# 3 datasets x 60 dataset draws x 3 model seeds x 8 new models = 4,320 fits.
runner:
  _target_: experiments.runners.data_parallel_runner.DataParallelRunner
  _recursive_: false
  threads_limit: null
  num_datasets: 60
  dataset_seed_start: 101
  model_seeds_per_dataset: 3
  save_raw_results: true
  n_jobs: 8
  backend: loky
  batch_size: auto

# Quality metrics match the old equal-budget run.  Optimization diagnostics are
# retained because clean radial mixtures frequently reached max_steps=150.
metrics:
  - _target_: experiments.metrics.FinalLoss
  - _target_: experiments.metrics.TrueRelativeObjectiveDrop
  - _target_: experiments.metrics.OptimizationOuterIterations
  - _target_: experiments.metrics.OptimizationConverged
  - _target_: experiments.metrics.FinalMeanGradientInfinityNorm
  - _target_: experiments.metrics.FinalLogVarianceGradientInfinityNorm
  - _target_: experiments.metrics.ForwardKL
  - _target_: experiments.metrics.WeightsTV
  - _target_: experiments.metrics.MeansNormalizedError
  - _target_: experiments.metrics.CovariancesAffineInvariantError
  - _target_: experiments.metrics.AdjustedRandIndex
  - _target_: experiments.metrics.MinimumSelectedBandwidth
  - _target_: experiments.metrics.MaximumSelectedBandwidth
  - _target_: experiments.metrics.MinimumEstimatedWeight
  - _target_: experiments.metrics.EstimatedVarianceRatio

  # Direct mechanism diagnostics at the smaller selected bandwidth.  Center
  # role 0 is a clean observation and role 1 is an observed uniform outlier.
  - _target_: experiments.metrics.SmallBandwidthEmpiricalMomentByCenterRole
    moment_order: 2
    moment_family: radial_second
    center_role: 0
    name: Small-s radial clean centers
  - _target_: experiments.metrics.SmallBandwidthEmpiricalMomentByCenterRole
    moment_order: 2
    moment_family: radial_second
    center_role: 1
    name: Small-s radial observed-outlier centers

radial_base: &radial_base
  _target_: src_np.gmm.MomentGaussianMixtureModel
  init: kmeans
  n_init: 10
  target_neighbor_counts: [17, 133]
  n_zero_moments: 0
  n_first_moments: 0
  n_second_moments: 0
  n_radial_second_moments: 1
  second_moment_mode: same_direction
  zero_moment_weight: 0.0
  first_moment_weight: 0.0
  second_moment_weight: 0.0
  radial_second_moment_weight: 1.0
  compensated_radial_second_moments: false
  normalize_moment_losses: true
  scale_normalize_moments: true
  leave_one_out: true
  amplitude_optimization: simplex
  s_optimization: joint
  geometry_optimization: component
  test_center_mode: data
  n_test_centers: null
  test_center_fraction: 1.0
  test_center_noise_std: auto
  r_tests_near_means: 0.0
  alpha_std_tests: 0.1
  mean_penalty_weight: 0.0
  objective_rtol: 1.0e-5
  objective_atol: 0.0
  convergence_patience: 3
  max_steps: 150
  geom_sweeps: 1
  ls_max_nfev: 30
  active_tol: 1.0e-8
  eta_step_bound: 0.75
  m_step_bound: null
  joint_polish_sweeps: 0
  joint_polish_max_nfev: null

radial_first_base: &radial_first_base
  <<: *radial_base
  n_first_moments: 10

radial_directional_base: &radial_directional_base
  <<: *radial_base
  # Generate the same first- and second-direction streams as the old
  # equal-budget directional endpoint.  M1 has zero objective weight here.
  n_first_moments: 10
  n_second_moments: 10
  second_moment_weight: 0.5
  radial_second_moment_weight: 0.5

models:
  # New radial endpoints.
  - model_name: radial_w1
    target:
      <<: *radial_base

  - model_name: radial_comp_w1
    target:
      <<: *radial_base
      compensated_radial_second_moments: true

  # The smallest positive M1 weight from the old contamination path and the
  # clean-data ratio w1/wR=1/8 selected by first3 + radial_w8.
  - model_name: radial_w1_first10_w003125
    target:
      <<: *radial_first_base
      first_moment_weight: 0.03125

  - model_name: radial_w1_first10_w0125
    target:
      <<: *radial_first_base
      first_moment_weight: 0.125

  - model_name: radial_comp_w1_first10_w003125
    target:
      <<: *radial_first_base
      first_moment_weight: 0.03125
      compensated_radial_second_moments: true

  - model_name: radial_comp_w1_first10_w0125
    target:
      <<: *radial_first_base
      first_moment_weight: 0.125
      compensated_radial_second_moments: true

  # Midpoints between the old directional endpoint and the radial endpoints.
  - model_name: second10_w05_radial_w05
    target:
      <<: *radial_directional_base

  - model_name: second10_w05_radial_comp_w05
    target:
      <<: *radial_directional_base
      compensated_radial_second_moments: true

dataset_base: &dataset_base
  _target_: experiments.synthetic_data.uniform_background.UniformBackgroundDatasetGenerator
  n_features: 10
  n_components: 3
  n_samples: 200
  covariance_type: spherical
  variance_spread: 3.0
  anisotropy: 1.0
  means_mode: fixed
  weights_concentration: 1000000.0
  min_mahalanobis_distance: 2.0
  box_padding: 4.0

datasets:
  - name: uniform_eps002_pad4_d10_n200_hard_varspread3
    target:
      <<: *dataset_base
      contamination_fraction: 0.02

  - name: uniform_eps005_pad4_d10_n200_hard_varspread3
    target:
      <<: *dataset_base
      contamination_fraction: 0.05

  - name: uniform_eps010_pad4_d10_n200_hard_varspread3
    target:
      <<: *dataset_base
      contamination_fraction: 0.10
