defaults:
  - metrics: optimization
  - aggregators: all
  - datasets/10d_spherical_well_separated@dataset_defs.spherical_well_separated
  - datasets/10d_spherical_bad_separated@dataset_defs.spherical_bad_separated
  - _self_

run_name: optimization_s_lower_sweep
save_dir: results
override: true
save_data_visualizations: true
num_visualization_samples: 3

runner:
  _target_: experiments.runners.data_parallel_runner.DataParallelRunner
  _recursive_: false
  threads_limit: null
  num_datasets: 20
  model_seeds_per_dataset: 10
  n_jobs: 8
  backend: loky
  batch_size: auto

population_model: &population_model
  _target_: experiments.wrappers.PopulationWrapper
  init: null
  means_noise_coef: 0.1
  sigmas_noise_coef: 0.1
  n_init: 1
  mean_penalty_weight: 0.0
  num_directions: 2
  joint_optimization: false
  max_steps: 30

models:
  - model_name: one_s_200
    target:
      <<: *population_model
      target_neighbor_counts: [200]
  - model_name: one_s_100
    target:
      <<: *population_model
      target_neighbor_counts: [100]
  - model_name: one_s_70
    target:
      <<: *population_model
      target_neighbor_counts: [70]
  - model_name: one_s_50
    target:
      <<: *population_model
      target_neighbor_counts: [50]
  - model_name: one_s_30
    target:
      <<: *population_model
      target_neighbor_counts: [30]
  - model_name: one_s_20
    target:
      <<: *population_model
      target_neighbor_counts: [20]
  - model_name: one_s_15
    target:
      <<: *population_model
      target_neighbor_counts: [15]
  - model_name: one_s_10
    target:
      <<: *population_model
      target_neighbor_counts: [10]
  - model_name: one_s_7
    target:
      <<: *population_model
      target_neighbor_counts: [7]
  - model_name: one_s_5
    target:
      <<: *population_model
      target_neighbor_counts: [5]
  - model_name: one_s_3
    target:
      <<: *population_model
      target_neighbor_counts: [3]
  - model_name: one_s_2
    target:
      <<: *population_model
      target_neighbor_counts: [2]
  - model_name: decreasing_s_200_to_2
    target:
      <<: *population_model
      target_neighbor_counts: [200, 100, 70, 50, 30, 20, 15, 10, 7, 5, 3, 2]
  - model_name: decreasing_s_50_to_2
    target:
      <<: *population_model
      target_neighbor_counts: [50, 30, 20, 15, 10, 7, 5, 3, 2]
  - model_name: decreasing_s_30_to_2
    target:
      <<: *population_model
      target_neighbor_counts: [30, 20, 15, 10, 7, 5, 3, 2]

datasets:
  - ${dataset_defs.spherical_well_separated}
  - ${dataset_defs.spherical_bad_separated}
