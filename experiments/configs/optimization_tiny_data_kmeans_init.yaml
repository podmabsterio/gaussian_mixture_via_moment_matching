defaults:
  - metrics: optimization
  - aggregators: all
  - _self_

run_name: optimization_tiny_data_kmeans_init
save_dir: results
override: true
save_data_visualizations: true
num_visualization_samples: 3

runner:
  _target_: experiments.runners.data_parallel_runner.DataParallelRunner
  _recursive_: false
  threads_limit: null
  num_datasets: 50
  model_seeds_per_dataset: 3
  n_jobs: 4
  backend: loky
  batch_size: auto

np_moment_kmeans: &np_moment_kmeans
  _target_: src_np.gmm.OneSGaussianMixtureModel
  init: kmeans
  n_init: 10
  target_neighbor_counts: auto
  mean_penalty_weight: 0.0
  num_directions: 2
  joint_optimization: false
  max_steps: 50

torch_linear_kmeans: &torch_linear_kmeans
  _target_: experiments.wrappers.TorchDimensionFreeLinearWrapper
  init_mode: kmeans
  target_neighbor_counts: auto
  kmeans_n_init: 10
  kmeans_max_iter: 300
  num_directions: 2
  include_base_kernel: false
  loss_mode: euclidean
  relaxed_parametrization: false
  precompute_Z: true
  optimizer: lbfgs
  lr: 1.0
  max_steps: 20
  batch_size: null
  Z_batch_size: null

sklearn_gmm_kmeans: &sklearn_gmm_kmeans
  _target_: experiments.wrappers.SklearnGaussianMixtureWrapper
  init_mode: kmeans
  covariance_type: spherical
  tol: 1e-5
  reg_covar: 1e-6
  max_iter: 500
  kmeans_n_init: 10
  kmeans_max_iter: 300

sklearn_kmeans: &sklearn_kmeans
  _target_: experiments.wrappers.SklearnKMeansWrapper
  init_mode: kmeans
  n_init: 10
  max_iter: 300
  tol: 1e-4

models:
  - model_name: np_moment_auto_s_kmeans
    target:
      <<: *np_moment_kmeans
  - model_name: torch_linear_auto_s_kmeans
    target:
      <<: *torch_linear_kmeans
  - model_name: sklearn_gmm_kmeans
    target:
      <<: *sklearn_gmm_kmeans
  - model_name: sklearn_kmeans
    target:
      <<: *sklearn_kmeans

datasets:
  - name: spherical_bad_separated_large_spread_n200
    target:
      _target_: experiments.synthetic_data.sampler_core.DatasetGenerator
      n_features: 10
      n_components: 3
      n_samples: 200
      covariance_type: spherical
      variance_spread: 4.0
      anisotropy: 1.0
      means_mode: fixed
      weights_concentration: 10.0
