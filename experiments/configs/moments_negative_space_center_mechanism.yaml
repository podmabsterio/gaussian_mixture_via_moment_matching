defaults:
  - aggregators: all
  - _self_

run_name: moments_negative_space_center_mechanism
save_dir: results
override: true
save_data_visualizations: false
num_visualization_samples: 0

# Mechanism test: do low-response spatial probes explain the robustness of
# second moments under diffuse uniform contamination?
#
# Each scenario has exactly 200 spatial centers and every moment model builds
# the same 1 zero + 10 first + 10 second probes at each center and bandwidth.
# Uniform probes REPLACE matched data-center slots; they are not appended.  This
# keeps both the statistical and computational probe budgets equal.
#
# The four eps=5% scenarios use identical contaminated datasets for a fixed
# dataset seed.  The two eps=0 scenarios likewise use identical clean datasets.
# Random directions use a separate RNG stream and are paired across scenarios.
#
# TODO(research): The contamination mask and true uniform box are oracle
# information used only for this mechanism test.  If uniform/empty probes help,
# replace their construction with a data-driven proposal before using the idea
# as an estimator.
#
# 6 scenarios x 40 dataset seeds x 3 model seeds x 5 models = 3,600 fits.
runner:
  _target_: experiments.runners.data_parallel_runner.DataParallelRunner
  _recursive_: false
  threads_limit: null
  num_datasets: 40
  dataset_seed_start: 201
  model_seeds_per_dataset: 3
  save_raw_results: true
  n_jobs: 8
  backend: loky
  batch_size: auto

metrics:
  - _target_: experiments.metrics.FinalLoss
  - _target_: experiments.metrics.RelativeLossDrop
  - _target_: experiments.metrics.ForwardKL
  - _target_: experiments.metrics.WeightsTV
  - _target_: experiments.metrics.MeansNormalizedError
  - _target_: experiments.metrics.CovariancesAffineInvariantError
  - _target_: experiments.metrics.AdjustedRandIndex
  - _target_: experiments.metrics.MinimumSelectedBandwidth
  - _target_: experiments.metrics.MaximumSelectedBandwidth
  - _target_: experiments.metrics.MinimumEstimatedWeight
  - _target_: experiments.metrics.EstimatedVarianceRatio

  # Direct mechanism diagnostics at the smaller selected bandwidth.  Responses
  # are already scale-normalized.  NaN means that a scenario has no centers of
  # the requested role (or that the row is an EM baseline).
  - _target_: experiments.metrics.SmallBandwidthEmpiricalMomentByCenterRole
    moment_order: 0
    center_role: 0
    name: Small-s m0 clean centers
  - _target_: experiments.metrics.SmallBandwidthEmpiricalMomentByCenterRole
    moment_order: 0
    center_role: 1
    name: Small-s m0 observed-outlier centers
  - _target_: experiments.metrics.SmallBandwidthEmpiricalMomentByCenterRole
    moment_order: 0
    center_role: 2
    name: Small-s m0 independent-uniform centers
  - _target_: experiments.metrics.SmallBandwidthEmpiricalMomentByCenterRole
    moment_order: 2
    center_role: 0
    name: Small-s m2 clean centers
  - _target_: experiments.metrics.SmallBandwidthEmpiricalMomentByCenterRole
    moment_order: 2
    center_role: 1
    name: Small-s m2 observed-outlier centers
  - _target_: experiments.metrics.SmallBandwidthEmpiricalMomentByCenterRole
    moment_order: 2
    center_role: 2
    name: Small-s m2 independent-uniform centers

moment_base: &moment_base
  _target_: src_np.gmm.MomentGaussianMixtureModel
  init: kmeans
  n_init: 10
  target_neighbor_counts: [17, 133]
  n_zero_moments: 1
  n_first_moments: 10
  n_second_moments: 10
  second_moment_mode: same_direction
  zero_moment_weight: 0.0
  first_moment_weight: 0.0
  second_moment_weight: 1.0
  normalize_moment_losses: true
  scale_normalize_moments: true
  leave_one_out: true
  amplitude_optimization: simplex
  s_optimization: joint
  geometry_optimization: component
  test_center_mode: data
  n_test_centers: null
  test_center_fraction: 1.0
  test_center_noise_std: auto
  r_tests_near_means: 0.0
  alpha_std_tests: 0.1
  mean_penalty_weight: 0.0
  objective_rtol: 1.0e-5
  objective_atol: 0.0
  convergence_patience: 3
  max_steps: 150
  geom_sweeps: 1
  ls_max_nfev: 30
  active_tol: 1.0e-8
  eta_step_bound: 0.75
  m_step_bound: null
  # TODO(research): Temporary oracle mechanism-test hook; never make this the
  # default model behavior without replacing labels/box by observable logic.
  experimental_oracle_test_centers: true
  experimental_uniform_center_fraction: 0.05

sklearn_gmm: &sklearn_gmm
  _target_: experiments.wrappers.SklearnGaussianMixtureWrapper
  init_mode: kmeans
  covariance_type: spherical
  tol: 1.0e-5
  reg_covar: 1.0e-2
  max_iter: 500
  kmeans_n_init: 10
  kmeans_max_iter: 300

models:
  # Best contaminated-data model.
  - model_name: pure_second_w1_0
    target:
      <<: *moment_base

  # Smallest positive first-order weight: detects an early change in the
  # weight path if removing empty probes changes the optimum.
  - model_name: second_plus_first_w1_003125
    target:
      <<: *moment_base
      first_moment_weight: 0.03125

  # Best compromise around 2% contamination.
  - model_name: second_plus_first_w1_0125
    target:
      <<: *moment_base
      first_moment_weight: 0.125

  # Best clean-data region from the equal-budget confirmation.
  - model_name: second_plus_first_w1_025
    target:
      <<: *moment_base
      first_moment_weight: 0.25

  - model_name: em_kmeans_reg1e2
    target:
      <<: *sklearn_gmm

dataset_base: &dataset_base
  _target_: experiments.synthetic_data.uniform_background.OracleCenterScenarioUniformBackgroundDatasetGenerator
  n_features: 10
  n_components: 3
  n_samples: 200
  covariance_type: spherical
  variance_spread: 3.0
  anisotropy: 1.0
  means_mode: fixed
  weights_concentration: 1000000.0
  min_mahalanobis_distance: 2.0
  box_padding: 4.0

datasets:
  # 1. Current estimator: all 200 observations, including ten outliers, are
  # centers.  This uses the ordinary non-oracle center-selection code path.
  - name: eps005_standard_all_observed
    target:
      <<: *dataset_base
      contamination_fraction: 0.05
      experimental_test_center_scenario: standard

  # 2. Oracle clean-only: each outlier slot is replaced by a repeated clean
  # data center, preserving exactly 200 centers.
  # TODO(research): The contamination mask is oracle-only.
  - name: eps005_oracle_clean_only
    target:
      <<: *dataset_base
      contamination_fraction: 0.05
      experimental_test_center_scenario: oracle_clean_only

  # 3. Oracle negative-space probes: the ten observed-outlier slots are
  # replaced by ten independent uniform locations in the same true box.
  # TODO(research): The true box is oracle-only.
  - name: eps005_oracle_clean_plus_independent_uniform
    target:
      <<: *dataset_base
      contamination_fraction: 0.05
      experimental_test_center_scenario: oracle_clean_plus_uniform

  # 4. Oracle reconstruction of 190 clean + ten actual outlier centers.  It is
  # intentionally equivalent to scenario 1 and checks that the temporary
  # oracle routing itself does not change directions, responses, or fits.
  # TODO(research): Remove this duplicate control after validating the path.
  - name: eps005_oracle_clean_plus_observed_outliers_control
    target:
      <<: *dataset_base
      contamination_fraction: 0.05
      experimental_test_center_scenario: oracle_clean_plus_outliers

  # 5. Clean reference with the ordinary 200 data centers.
  - name: eps000_standard_all_observed
    target:
      <<: *dataset_base
      contamination_fraction: 0.0
      experimental_test_center_scenario: standard

  # 6. Clean data with 5% of the center slots replaced by independent uniform
  # box probes.  Replacement keeps the total at 200, unlike literal appending.
  # TODO(research): The box is oracle-only and needs a data-driven replacement
  # if this control improves quality.
  - name: eps000_oracle_clean_plus_independent_uniform
    target:
      <<: *dataset_base
      contamination_fraction: 0.0
      experimental_test_center_scenario: oracle_clean_plus_uniform
