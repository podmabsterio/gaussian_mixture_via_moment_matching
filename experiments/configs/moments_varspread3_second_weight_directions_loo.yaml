  - model_name: second_only_d2_20
    target:
      <<: *d2_20_base
      first_moment_weight: 0.0
      second_moment_weight: 1.0

  # First-only lower endpoint; D2 is generated but has zero objective weight.
  - model_name: first_only
    target:
      <<: *d2_1_base
      second_moment_weight: 0.0

  - model_name: em_kmeans_reg1e6
    target:
      <<: *sklearn_gmm_kmeans

  - model_name: em_kmeans_reg1e2
    target:
      <<: *sklearn_gmm_kmeans
      reg_covar: 1.0e-2

  - model_name: kmeans_spherical
    target:
